[package]
name = "lookout-mail"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lookout-core.workspace = true
async-channel.workspace = true
async-trait.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true

async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
base64 = "0.22"

tokio-rustls = "0.26"
rustls-native-certs = "0.8"

mail-parser = "0.11"
mail-builder = "0.4"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
uuid.workspace = true

rusqlite = { version = "0.32", features = ["bundled"] }
serde_json.workspace = true

[features]
# Only for lookout-mail's own integration tests (see tests/imap_integration.rs):
# exposes an insecure TLS connector that accepts any server certificate, so
# tests can talk to an ephemeral local GreenMail container's self-signed
# cert. Enabled below via a self-referencing dev-dependency, which Cargo
# only applies when building this crate's own test/example/bench targets -
# a normal consumer (e.g. lookout-app) depending on lookout-mail never
# enables this feature and never links this code path.
test-utils = []

[dev-dependencies]
anyhow = "1"
# Same version/features as the regular dependency: the integration test opens
# its own plain-TCP IMAP session to APPEND a crafted message with an
# attachment, which `run_account_session`'s public API has no way to do.
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
lookout-goa.workspace = true
lookout-mail = { path = ".", features = ["test-utils"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber.workspace = true
testcontainers = "0.27"
