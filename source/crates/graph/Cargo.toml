[package]
name = "lookout-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Microsoft Graph client skeleton for Lookout"
repository.workspace = true

[dependencies]
async-channel.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
lookout-core.workspace = true
# The Graph mail session (MAIL_GRAPH_OVERVIEW.md item 5.7.5) speaks the mail
# crate's `AccountCommand`/`AccountEvent` contract and stores into its `Cache`.
lookout-mail.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
wiremock = "0.6"
