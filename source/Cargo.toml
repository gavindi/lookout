[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/goa",
    "crates/mail",
    "crates/dav",
    "crates/app",
]

[workspace.package]
version = "0.6.3"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/gavindi/lookout"

[workspace.dependencies]
lookout-core = { path = "crates/core" }
lookout-goa = { path = "crates/goa" }
lookout-mail = { path = "crates/mail" }
lookout-dav = { path = "crates/dav" }

tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
async-channel = "2"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
