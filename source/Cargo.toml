[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/goa",
    "crates/mail",
    "crates/dav",
    "crates/app",
    "crates/async-imap",
]

# Local copy of `imap-proto` 0.16.7 with one unreleased upstream fix (see
# `crates/imap-proto/Cargo.toml`): `is_char` accepts 8-bit bytes so servers
# sending raw UTF-8 in ENVELOPE fields parse instead of failing the whole
# response stream.
#
# Local copy of `async-imap` 0.11.3 with two local changes (see
# `crates/async-imap/Cargo.toml`): `Session::map_stream`, the in-place stream
# swap that lets the mail session enable `COMPRESS DEFLATE` without losing
# the connection if the server rejects it; and `imap_stream.rs`'s response
# buffering, which used to copy the entire unconsumed tail into a fresh
# allocation on every parsed response (O(k^2) over a multi-response burst) -
# it now parses into an owned `Response` (`imap-proto`'s existing
# `into_owned()`) and advances the buffer in place instead.
[patch.crates-io]
imap-proto = { path = "crates/imap-proto" }
async-imap = { path = "crates/async-imap" }

[workspace.package]
version = "0.9.92"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/gavindi/lookout"

[workspace.dependencies]
lookout-core = { path = "crates/core" }
lookout-goa = { path = "crates/goa" }
lookout-mail = { path = "crates/mail" }
lookout-dav = { path = "crates/dav" }

tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
async-channel = "2"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Lookout's own OAuth2 client for Microsoft 365 accounts (GOA's token is
# Graph-scoped only and can't authenticate to Exchange Online IMAP/SMTP).
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
